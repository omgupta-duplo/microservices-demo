apiVersion: apps/v1
kind: Deployment
metadata:
  name: microservices-demo
  labels:
    app: microservices-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: microservices-demo
  template:
    metadata:
      labels:
        app: microservices-demo
    spec:
      containers:
        - name: microservices-demo
          image: ghcr.io/omgupta-duplo/microservices-demo:latest
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          envFrom:
            - configMapRef:
                name: microservices-demo-config
