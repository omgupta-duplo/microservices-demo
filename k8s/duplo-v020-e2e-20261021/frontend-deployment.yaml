apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: microservices-demo
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        # Preserved from the repository's own frontend manifests: without this, an Istio
        # sidecar rewrites the HTTP probes and drops the shop_session-id Cookie headers below.
        sidecar.istio.io/rewriteAppHTTPProbers: "true"
    spec:
      # Pod securityContext preserved from kubernetes-manifests/frontend.yaml.
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: frontend
          image: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend:v0.10.7
          imagePullPolicy: IfNotPresent
          # Container securityContext preserved from kubernetes-manifests/frontend.yaml.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: frontend-config
            - secretRef:
                name: frontend-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          # Probes preserved from the repository's frontend manifests: /_healthz on 8080,
          # initialDelaySeconds 10, and the shop_session-id Cookie the frontend expects.
          readinessProbe:
            httpGet:
              path: /_healthz
              port: 8080
              httpHeaders:
                - name: Cookie
                  value: shop_session-id=x-readiness-probe
            initialDelaySeconds: 10
          livenessProbe:
            httpGet:
              path: /_healthz
              port: 8080
              httpHeaders:
                - name: Cookie
                  value: shop_session-id=x-liveness-probe
            initialDelaySeconds: 10
