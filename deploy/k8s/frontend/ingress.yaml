# Public exposure for the frontend. No hostname was chosen, so this rule
# matches any host on path "/".
# ingressClassName is not set: the cluster's default IngressClass is used.
# If your cluster has none, set it, e.g. `ingressClassName: nginx` or `alb`.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microservices-demo
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
