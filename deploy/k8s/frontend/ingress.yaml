# Public exposure for the frontend.
# No hostname set: matches requests for any host on path "/".
# ingressClassName is not set, so the cluster's default IngressClass is used.
# To pin a controller or host, uncomment and edit below. TLS is not configured.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: online-boutique
    app.kubernetes.io/managed-by: kube-deploy-agent
spec:
  # ingressClassName: nginx   # or alb, traefik, etc.
  rules:
    - # host: shop.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
