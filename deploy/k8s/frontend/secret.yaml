# Secret PLACEHOLDER for frontend. Contains no real credentials.
# The frontend currently reads no secret values, so no keys are defined.
# To add one later, add under stringData, e.g.:
#   MY_API_KEY: "REPLACE_ME"
# and populate the real value out-of-band (e.g. External Secrets / sealed secrets).
# Do NOT commit real secret values to Git.
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microservices-demo
type: Opaque
stringData: {}
