# Secret PLACEHOLDER for frontend. Contains no real credentials.
# The frontend reads no secret values today, so no keys are defined.
# To add one later, add a key under stringData (e.g. MY_API_KEY: "REPLACE_ME")
# and supply the real value out-of-band (External Secrets, Sealed Secrets, etc.).
# Do NOT commit real secret values to Git.
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microservices-demo
type: Opaque
stringData: {}
