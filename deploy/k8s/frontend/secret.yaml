# Secret PLACEHOLDER. The frontend does not need any secrets today, so this
# Secret is intentionally empty. It is mounted via envFrom (optional: true).
#
# To add a secret later, add a key with a placeholder value, e.g.
#   stringData:
#     SOME_API_KEY: "REPLACE_ME"
# and inject the real value at deploy time (External Secrets, Sealed Secrets,
# your CI secret store, or `kubectl create secret`). Never commit real values.
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: microservices-demo
type: Opaque
stringData: {}
