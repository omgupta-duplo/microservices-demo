# Secret PLACEHOLDER for the frontend.
# The frontend currently needs no secrets, so this Secret is intentionally empty.
# To add one later, add a key under stringData with a placeholder value, e.g.:
#   stringData:
#     SOME_API_KEY: "REPLACE_ME"
# Never commit real values. Populate real values out-of-band
# (e.g. kubectl create secret, External Secrets Operator, Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: frontend-secrets
  labels:
    app: frontend
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: online-boutique
    app.kubernetes.io/managed-by: kube-deploy-agent
type: Opaque
stringData: {}
