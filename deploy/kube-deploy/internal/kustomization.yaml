# Generated by kube-deploy (preview). Internal-only baseline incl. shopping assistant.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../kubernetes-manifests
  - shoppingassistant-config.yaml
  - shoppingassistant-secret.yaml
components:
  - ../../../kustomize/components/shopping-assistant
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
  # Source shopping-assistant env from ConfigMap/Secret instead of inline *_VAL placeholders.
  - target:
      kind: Deployment
      name: shoppingassistantservice
    patch: |-
      - op: remove
        path: /spec/template/spec/containers/0/env
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef:
              name: shoppingassistant-config
          - secretRef:
              name: shoppingassistant-secret
