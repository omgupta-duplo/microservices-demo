# Generated by DuploCloud kube-deploy.
name: "Duplo Kube Deploy - Build & Push"

on:
  push:
    branches:
      - main
      - 'duplo/kube-deploy-*'
  workflow_dispatch: {}

env:
  AWS_REGION: us-west-2
  ECR_REGISTRY: 805863115079.dkr.ecr.us-west-2.amazonaws.com
  REPO_NAME: microservices-demo

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service:
          - name: adservice
            context: src/adservice
            dockerfile: src/adservice/Dockerfile
          - name: cartservice
            context: src/cartservice/src
            dockerfile: src/cartservice/src/Dockerfile
          - name: checkoutservice
            context: src/checkoutservice
            dockerfile: src/checkoutservice/Dockerfile
          - name: currencyservice
            context: src/currencyservice
            dockerfile: src/currencyservice/Dockerfile
          - name: emailservice
            context: src/emailservice
            dockerfile: src/emailservice/Dockerfile
          - name: frontend
            context: src/frontend
            dockerfile: src/frontend/Dockerfile
          - name: loadgenerator
            context: src/loadgenerator
            dockerfile: src/loadgenerator/Dockerfile
          - name: paymentservice
            context: src/paymentservice
            dockerfile: src/paymentservice/Dockerfile
          - name: productcatalogservice
            context: src/productcatalogservice
            dockerfile: src/productcatalogservice/Dockerfile
          - name: recommendationservice
            context: src/recommendationservice
            dockerfile: src/recommendationservice/Dockerfile
          - name: shippingservice
            context: src/shippingservice
            dockerfile: src/shippingservice/Dockerfile
      fail-fast: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Resolve tags
        id: tags
        run: |
          BRANCH_SLUG=$(echo "${GITHUB_REF_NAME}" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]/-/g')
          SHA_TAG="sha-${GITHUB_SHA:0:12}"
          echo "branch_slug=${BRANCH_SLUG}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESSKEYID }}
          aws-secret-access-key: ${{ secrets.SECRETACCESSKEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "${REPO_NAME}/${{ matrix.service.name }}" \
            || aws ecr create-repository --repository-name "${REPO_NAME}/${{ matrix.service.name }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.REPO_NAME }}/${{ matrix.service.name }}:${{ steps.tags.outputs.branch_slug }}
            ${{ env.ECR_REGISTRY }}/${{ env.REPO_NAME }}/${{ matrix.service.name }}:${{ steps.tags.outputs.sha_tag }}
