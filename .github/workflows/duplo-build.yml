# Generated by DuploCloud kube-deploy.
#
# Builds and pushes a container image to Amazon ECR for every service in this
# repository. One matrix entry per discovered Dockerfile; each service gets its
# own slash-nested ECR repository (microservices-demo/<service>), created on
# first run if it does not already exist.
#
# The repo's existing ci-main.yaml / deploy-pr.yaml publish to Google Artifact
# Registry via skaffold + Workload Identity, so they cannot serve as the image
# source for an EKS deployment. This workflow is additive and leaves them alone.
#
# Required repository secrets: ACCESSKEYID, SECRETACCESSKEY

name: Duplo Build and Push

on:
  push:
    branches:
      - main
      - duplo/kube-deploy-*
  workflow_dispatch: {}

env:
  # REPLACE_ME: no AWS scope was attached to this resource, so the region could
  # not be derived. Set this to the region hosting the ECR registry.
  AWS_REGION: REPLACE_ME
  IMAGE_REPO_PREFIX: microservices-demo

permissions:
  contents: read

jobs:
  build-push:
    name: build-push (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: adservice
            context: src/adservice
            dockerfile: src/adservice/Dockerfile
          - service: cartservice
            context: src/cartservice/src
            dockerfile: src/cartservice/src/Dockerfile
          - service: checkoutservice
            context: src/checkoutservice
            dockerfile: src/checkoutservice/Dockerfile
          - service: currencyservice
            context: src/currencyservice
            dockerfile: src/currencyservice/Dockerfile
          - service: emailservice
            context: src/emailservice
            dockerfile: src/emailservice/Dockerfile
          - service: frontend
            context: src/frontend
            dockerfile: src/frontend/Dockerfile
          - service: loadgenerator
            context: src/loadgenerator
            dockerfile: src/loadgenerator/Dockerfile
          - service: paymentservice
            context: src/paymentservice
            dockerfile: src/paymentservice/Dockerfile
          - service: productcatalogservice
            context: src/productcatalogservice
            dockerfile: src/productcatalogservice/Dockerfile
          - service: recommendationservice
            context: src/recommendationservice
            dockerfile: src/recommendationservice/Dockerfile
          - service: shippingservice
            context: src/shippingservice
            dockerfile: src/shippingservice/Dockerfile
          - service: shoppingassistantservice
            context: src/shoppingassistantservice
            dockerfile: src/shoppingassistantservice/Dockerfile

    steps:
      - uses: actions/checkout@v7

      - name: Compute image tags
        id: tags
        run: |
          set -euo pipefail
          slug=$(printf '%s' "${GITHUB_REF_NAME}" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -e 's/[^a-z0-9._-]/-/g' -e 's/^[.-]*//' \
            | cut -c1-100)
          echo "branch_tag=${slug}" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.ACCESSKEYID }}
          aws-secret-access-key: ${{ secrets.SECRETACCESSKEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          set -euo pipefail
          repo="${IMAGE_REPO_PREFIX}/${{ matrix.service }}"
          aws ecr describe-repositories --repository-names "$repo" --region "${AWS_REGION}" >/dev/null 2>&1 \
            || aws ecr create-repository \
                 --repository-name "$repo" \
                 --region "${AWS_REGION}" \
                 --image-scanning-configuration scanOnPush=true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_REPO_PREFIX }}/${{ matrix.service }}:${{ steps.tags.outputs.branch_tag }}
            ${{ steps.ecr.outputs.registry }}/${{ env.IMAGE_REPO_PREFIX }}/${{ matrix.service }}:${{ steps.tags.outputs.sha_tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
