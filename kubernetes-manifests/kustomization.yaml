apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Generated by DuploCloud kube-deploy: namespace, image overrides, managed-by
# label, and the frontend-external -> ClusterIP patch below.
namespace: microservices-demo-main
resources:
 - adservice.yaml
 - cartservice.yaml
 - checkoutservice.yaml
 - currencyservice.yaml
 - emailservice.yaml
 - frontend.yaml
# - loadgenerator.yaml # During development, the loadgenerator module inside skaffold.yaml will be used.
 - paymentservice.yaml
 - productcatalogservice.yaml
 - recommendationservice.yaml
 - shippingservice.yaml
# components:
# - ../kustomize/components/cymbal-branding
# - ../kustomize/components/google-cloud-operations
# - ../kustomize/components/memorystore
# - ../kustomize/components/network-policies
# - ../kustomize/components/alloydb
# - ../kustomize/components/shopping-assistant
# - ../kustomize/components/spanner
# - ../kustomize/components/container-images-tag
# - ../kustomize/components/container-images-tag-suffix
# - ../kustomize/components/container-images-registry
commonLabels:
  app.kubernetes.io/managed-by: duplo-kube-deploy
images:
 - name: adservice
   newName: 805863115079.dkr.ecr.us-west-2.amazonaws.com/microservices-demo/adservice
   newTag: duplo-kube-deploy-kd-test-1
 - name: cartservice
   newName: 805863115079.dkr.ecr.us-west-2.amazonaws.com/microservices-demo/cartservice
   newTag: duplo-kube-deploy-kd-test-1
 - name: checkoutservice
   newName: 805863115079.dkr.ecr.us-west-2.amazonaws.com/microservices-demo/checkoutservice
   newTag: duplo-kube-deploy-kd-test-1
 - name: currencyservice
   newName: 805863115079.dkr.ecr.us-west-2.amazonaws.com/microservices-demo/currencyservice
   newTag: duplo-kube-deploy-kd-test-1
 - name: emailservice
   newName: 805863115079.dkr.ecr.us-west-2.amazonaws.com/microservices-demo/emailservice
   newTag: duplo-kube-deploy-kd-test-1
 - name: frontend
   newName: 805863115079.dkr.ecr.us-west-2.amazonaws.com/microservices-demo/frontend
   newTag: duplo-kube-deploy-kd-test-1
 - name: paymentservice
   newName: 805863115079.dkr.ecr.us-west-2.amazonaws.com/microservices-demo/paymentservice
   newTag: duplo-kube-deploy-kd-test-1
 - name: productcatalogservice
   newName: 805863115079.dkr.ecr.us-west-2.amazonaws.com/microservices-demo/productcatalogservice
   newTag: duplo-kube-deploy-kd-test-1
 - name: recommendationservice
   newName: 805863115079.dkr.ecr.us-west-2.amazonaws.com/microservices-demo/recommendationservice
   newTag: duplo-kube-deploy-kd-test-1
 - name: shippingservice
   newName: 805863115079.dkr.ecr.us-west-2.amazonaws.com/microservices-demo/shippingservice
   newTag: duplo-kube-deploy-kd-test-1
patches:
 - target:
     kind: Service
     name: frontend-external
   patch: |-
     - op: replace
       path: /spec/type
       value: ClusterIP
